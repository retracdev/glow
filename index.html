<!doctype html>
<html lang="en" class="is-splashing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Filled in from version.yml by the build (vite.config.ts). Edit version.yml, not this. -->
    <meta name="glow-version" content="%GLOW_VERSION%" />
    <!-- Live updates. Loads first so it can track and shut down everything the app starts. -->
    <script src="/live-update.js" data-live-update></script>
    <meta name="theme-color" content="#05040a" />
    <meta name="color-scheme" content="dark" />
    <title>Glow: Creative Light Art Tool · retrac.space</title>
    <meta name="description" content="Create glowing drawings, experiment with light, explore symmetry, and design colorful particle effects. Glow is a creative art tool, not a video game. It has no scores, levels, or competitive gameplay." />
    <meta name="keywords" content="creative tool, digital art, light art, drawing tool, generative art, symmetry, particle effects" />
    <link rel="canonical" href="https://glowstudio.retrac.space/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="retrac.space" />
    <meta property="og:title" content="Glow: Creative Light Art Tool" />
    <meta property="og:description" content="Create glowing drawings, experiment with light, explore symmetry, and design colorful particle effects. Glow is a creative art tool, not a video game." />
    <meta property="og:url" content="https://glowstudio.retrac.space/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Glow",
        "url": "https://glowstudio.retrac.space/",
        "applicationCategory": "DesignApplication",
        "applicationSubCategory": "Digital art tool",
        "operatingSystem": "Any",
        "browserRequirements": "Requires WebGL 2",
        "isAccessibleForFree": true,
        "description": "Create glowing drawings, experiment with light, explore symmetry, and design colorful particle effects. Glow is a creative art tool, not a video game. It has no scores, levels, or competitive gameplay.",
        "publisher": { "@type": "Organization", "name": "retrac.space", "url": "https://retrac.space" }
      }
    </script>
    <style>
      html, body { background: #05040a; }
      html.is-splashing { overflow: hidden; }

      /* The loading screen. Inline so it paints before the app's styles arrive. */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 34px;
        background: #000;
        transition: opacity .55s cubic-bezier(.22, 1, .36, 1) .1s, visibility 0s linear .65s;
      }
      .splash__icon {
        width: 112px;
        height: 112px;
        filter: drop-shadow(0 10px 34px rgb(51 195 245 / .35));
        animation: splash-pop .6s cubic-bezier(.2, 1.4, .4, 1) .08s backwards;
        transition: transform .55s cubic-bezier(.5, 0, .2, 1), opacity .45s ease-in;
      }
      .splash__track {
        width: min(200px, 56vw);
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / .1);
        animation: splash-fade .4s ease-out .3s backwards;
        transition: opacity .25s ease-in;
      }
      .splash__fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1774e4, #33c3f5, #8ef0ff);
        box-shadow: 0 0 12px rgb(51 195 245 / .7);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform .3s cubic-bezier(.22, 1, .36, 1);
      }
      .splash__fill.is-running { transition: none; }

      .splash.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash.is-leaving .splash__icon { animation: none; transform: scale(1.6); opacity: 0; }
      .splash.is-leaving .splash__track { animation: none; opacity: 0; }

      @keyframes splash-pop {
        from { opacity: 0; transform: scale(.3); }
        60% { opacity: 1; }
        to { transform: scale(1); }
      }
      @keyframes splash-fade { from { opacity: 0; } }

      /* Glow rises in as the loading screen fades. */
      html.is-revealing #root { animation: site-in .8s cubic-bezier(.2, .9, .3, 1) .1s backwards; }
      @keyframes site-in { from { opacity: 0; transform: translateY(14px) scale(.985); } }

      @media (prefers-reduced-motion: reduce) {
        .splash { transition: opacity .2s linear, visibility 0s linear .2s; }
        .splash__icon, .splash__track { animation: splash-fade .2s linear backwards; }
        .splash.is-leaving .splash__icon { transform: none; }
        html.is-revealing #root { animation: none; }
      }
    </style>
    <noscript><style>.splash { display: none; } html.is-splashing { overflow: auto; }</style></noscript>
  </head>
  <body>
    <!-- The loading screen. /splash.js fills the bar and takes it away. Live updates show it again (data-update-splash). -->
    <div class="splash" id="splash" data-update-splash role="progressbar" aria-label="Loading Glow" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <img class="splash__icon" src="/favicon.svg" alt="" width="112" height="112" />
      <div class="splash__track"><div class="splash__fill"></div></div>
    </div>
    <div id="root"></div>
    <noscript>
      <main style="color:#fff;font-family:system-ui,sans-serif;max-width:40rem;margin:0 auto;padding:2rem">
        <h1>Glow</h1>
        <p>Create glowing drawings, experiment with light, explore symmetry, and design colorful particle effects.</p>
        <p>Glow is a creative art tool, not a video game. It has no scores, levels, or competitive gameplay.</p>
        <p>Glow needs JavaScript and WebGL 2 to run.</p>
      </main>
    </noscript>
    <script src="/splash.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
