name: Deploy Glow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Glow
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Reruns keep artifacts from earlier attempts, so give each attempt its own name. The
      # deploy job reads it from this job's output, so re-running only a failed deploy still
      # finds the artifact this job uploaded.
      - name: Name the artifact
        id: name
        run: echo "artifact=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: ./dist

  # A separate job, as in GitHub's own Pages workflow. Deploying in the same job as the upload
  # raced the artifact listing: deploy-pages looked for the artifact a fraction of a second
  # after upload and sometimes couldn't see it yet ("No artifacts named ... were found").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
